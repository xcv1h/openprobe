<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openprobe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login">
    <h1 class="wordmark">openprobe</h1>
    <!-- Decoration only: four conductors of a network cable -->
    <div class="wire" aria-hidden="true"><i class="wo"></i><i class="o"></i><i class="wg"></i><i class="b"></i></div>

    <!-- Placeholder: submitting just opens the buildings list.
         Later: pb.collection('users').authWithPassword(email, password) -->
    <form action="buildings.html">
      <label for="email">email</label>
      <input id="email" type="email">

      <label for="password">password</label>
      <input id="password" type="password">

      <button class="primary">log in</button>
    </form>

    <p class="pitch">the console password is all it needs.</p>
  </main>
</body>
</html>
